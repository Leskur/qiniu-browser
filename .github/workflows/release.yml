name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-15'
            args: '--target aarch64-apple-darwin'
            assetLabel: 'macOS_Apple-Silicon'
          - platform: 'macos-15-intel'
            args: '--target x86_64-apple-darwin'
            assetLabel: 'macOS_Intel'
          - platform: 'windows-2025'
            args: ''
            assetLabel: 'Windows_x64'
          - platform: 'ubuntu-22.04'
            args: ''
            assetLabel: 'Linux_x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Qiniu Browser ${{ github.ref_name }}'
          releaseBody: |
            请选择适合你设备的安装包：
            - macOS M 系列芯片（M1、M2、M3、M4 等）：下载 `macOS_Apple-Silicon.dmg`
            - macOS Intel 芯片：下载 `macOS_Intel.dmg`
            - Windows 64 位 Intel / AMD：下载 `Windows_x64_setup.exe`
            - Linux 64 位 Intel / AMD：下载 `Linux_x64.deb`（Debian / Ubuntu）或 `Linux_x64.AppImage`

            以上为文件名后缀。`.sig`、`.app.tar.gz` 和 `latest.json` 用于自动更新，手动安装请选择上面的安装包。
          releaseDraft: true
          prerelease: false
          args: ${{ runner.os == 'macOS' && format('{0} --bundles app,dmg', matrix.args) || matrix.args }}
          assetNamePattern: 'Qiniu.Browser_[version]_${{ matrix.assetLabel }}[_setup][ext]'
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

  publish:
    name: Publish stable release
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft=false --prerelease=false
